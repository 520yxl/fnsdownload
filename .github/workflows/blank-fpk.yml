name: Blank fnOS FPK install test
on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/blank-fpk.yml"
  workflow_dispatch:
jobs:
  build-blank-fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official fnpack
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64 -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --help
      - name: Create minimal fnOS application package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/hellofnos"
          mkdir -p "$WORK/app/ui/images" "$WORK/cmd" "$WORK/config" "$WORK/wizard"
          cat > "$WORK/manifest" <<'EOF'
          appname=hellofnos
          version=1.0.0
          display_name=Hello fnOS Install Test
          desc=Minimal fnOS static app used to verify package compatibility
          source=thirdparty
          platform=all
          maintainer=MoxYi
          distributor=MoxYi
          os_min_version=1.2.0
          ctl_stop=false
          checkport=false
          desktop_uidir=ui
          desktop_applaunchname=hellofnos.Application
          disable_authorization_path=true
          EOF
          cat > "$WORK/config/privilege" <<'EOF'
          {
            "defaults": {
              "run-as": "package"
            }
          }
          EOF
          cat > "$WORK/config/resource" <<'EOF'
          {}
          EOF
          cat > "$WORK/app/ui/index.html" <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>MoxYi Blank Install Test</title>
          </head>
          <body style="font-family:system-ui,sans-serif;padding:40px">
            <h1>MoxYi Blank Install Test</h1>
            <p>如果此包安装成功，说明最小 FPK 框架可以被 fnOS 接受。</p>
            <p>此测试包不包含下载服务、数据库、端口监听或下载引擎。</p>
            <p>Version: 1.0.0</p>
          </body>
          </html>
          EOF
          cat > "$WORK/app/ui/config" <<'EOF'
          {
            ".url": {
              "hellofnos.Application": {
                "title": "Hello fnOS",
                "desc": "最小化安装验证应用",
                "icon": "images/icon_{0}.png",
                "type": "iframe",
                "url": "/",
                "width": 800,
                "height": 600,
                "allUsers": true
              }
            }
          }
          EOF
          cp ICON.PNG "$WORK/app/ui/images/icon_0.png"
          cp ICON_256.PNG "$WORK/app/ui/images/icon_1.png"
          for name in install upgrade uninstall config; do printf '[]\n' > "$WORK/wizard/$name"; done
          for name in install_init install_callback upgrade_init upgrade_callback uninstall_init uninstall_callback config_init config_callback; do
            printf '#!/usr/bin/env bash\nset -e\nexit 0\n' > "$WORK/cmd/$name"
          done
          cat > "$WORK/cmd/main" <<'EOF'
          #!/usr/bin/env bash
          set -e
          case "$1" in
            start|stop) exit 0 ;;
            status) exit 3 ;;
            *) exit 1 ;;
          esac
          EOF
          cp ICON.PNG ICON_256.PNG "$WORK/"
          chmod 755 "$WORK/cmd/"*
          sudo chown -R 0:0 "$WORK"
          echo "$WORK" > "$RUNNER_TEMP/blank-fpk-work"
      - name: Build using official fnpack
        run: |
          set -euo pipefail
          WORK="$(cat "$RUNNER_TEMP/blank-fpk-work")"
          cd "$WORK"
          sudo -n fnpack build --directory . --nosign
          FPK="$(find "$WORK" -maxdepth 3 -type f -name '*.fpk' -print -quit)"
          test -n "$FPK"
          mkdir -p "$GITHUB_WORKSPACE/dist-blank"
          cp "$FPK" "$GITHUB_WORKSPACE/dist-blank/Hello-fnOS-Install-Test-all.fpk"
      - name: Verify FPK structure without modifying the package
        run: |
          set -euo pipefail
          FPK="dist-blank/MoxYi-Blank-Install-Test-x86.fpk"
          file "$FPK"
          tar -tzf "$FPK" | tee dist-blank/outer-files.txt
          for item in manifest cmd/main cmd/install_init cmd/install_callback config/privilege wizard/install wizard/upgrade wizard/uninstall wizard/config ICON.PNG ICON_256.PNG app.tgz; do
            grep -Eq "(^|\\./)$item$" dist-blank/outer-files.txt || { echo "Missing outer entry: $item"; exit 1; }
          done
          APP_ENTRY="$(awk '$0 ~ /app[.]tgz$/ {print; exit}' dist-blank/outer-files.txt)"
          test -n "$APP_ENTRY"
          tar -xOf "$FPK" "$APP_ENTRY" | tar -tzf - | tee dist-blank/app-files.txt
          grep -Eq '(^|\\./)ui/index[.]html$' dist-blank/app-files.txt
          sha256sum "$FPK" | tee dist-blank/SHA256SUMS.txt
          stat -c 'FPK_SIZE=%s' "$FPK" | tee dist-blank/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hellofnos-install-test-fpk
          path: dist-blank/
          if-no-files-found: error
          retention-days: 14
