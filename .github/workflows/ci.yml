name: Go CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/fnsdownload ./cmd/fnsdownload
      - uses: actions/upload-artifact@v4
        with:
          name: fnsdownload-go-linux-amd64
          path: build/fnsdownload
          if-no-files-found: error
          retention-days: 14
