services:
  fnsdownload:
    image: ghcr.io/520yxl/fnsdownload:latest
    container_name: fnsdownload
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      NODE_ENV: production
      PORT: "8088"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      APP_TIMEZONE: Asia/Shanghai
    volumes:
      - ${TRIM_APPDEST}/data:/data
      - ${TRIM_DOWNLOAD_PATH}:/downloads
    # The official Node.js native SDK currently supports Linux x64 only.
    platform: linux/amd64
