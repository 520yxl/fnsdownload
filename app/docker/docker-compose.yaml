services:
  fnsdownload:
    image: ghcr.io/520yxl/fnsdownload:develop
    container_name: fnsdownload
    restart: unless-stopped
    ports:
      - "${wizard_port:-${TRIM_SERVICE_PORT}}:8088"
    environment:
      NODE_ENV: production
      PORT: "8088"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      APP_TIMEZONE: Asia/Shanghai
    volumes:
      - ${TRIM_PKGVAR}/data:/data
      - ${TRIM_APPDEST_VOL}/@appshare/fnsdownload/downloads:/downloads
    platform: linux/amd64
